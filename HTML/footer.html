<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creadify Footer</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

<style>
  /* ==========================================================================
     Creadify — Footer Section (self-contained, WordPress-ready)
     ========================================================================== */
  .cf-footer-root, .cf-footer-root *, .cf-footer-root *::before, .cf-footer-root *::after {
    box-sizing: border-box;
  }

  .cf-footer-root {
    --cf-color-primary-900: #082744;
    --cf-color-surface: #f8fafc;
    --cf-color-border: #e2e8f0;
    --cf-color-text-muted: #475569;
    --cf-container-max: 1200px;
    font-family: "Golos Text", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .cf-footer-root a { color: inherit; text-decoration: none; }
  .cf-footer-root img { max-width: 100%; display: block; }
  .cf-footer-root ul { margin: 0; padding: 0; list-style: none; }
  .cf-footer-root p { margin: 0; line-height: 1.65; }

  .cf-footer {
    background: var(--cf-color-surface);
  }

  .cf-footer-container {
    margin-inline: auto;
    width: 100%;
    max-width: var(--cf-container-max);
    padding-inline: 16px;
  }
  @media (min-width: 640px) { .cf-footer-container { padding-inline: 24px; } }
  @media (min-width: 1024px) { .cf-footer-container { padding-inline: 32px; } }

  .cf-footer-inner {
    padding-block: 64px;
  }
  @media (min-width: 640px) { .cf-footer-inner { padding-block: 80px; } }

  .cf-footer-logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .cf-footer-logo img { height: 36px; width: auto; }

  .cf-footer-divider {
    margin-top: 56px;
    border-top: 1px solid var(--cf-color-border);
  }

  .cf-footer-bottom {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  @media (min-width: 640px) {
    .cf-footer-bottom { flex-direction: row; justify-content: space-between; }
  }

  .cf-footer-copy {
    text-align: center;
    font-size: 14px;
    color: var(--cf-color-text-muted);
  }
  .cf-footer-copy a {
    color: #2563eb;
    text-decoration: underline;
    transition: color 150ms;
  }
  .cf-footer-copy a:hover { color: #1d4ed8; }

  .cf-footer-socials {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  @media (min-width: 640px) { .cf-footer-socials { justify-content: flex-end; } }

  .cf-footer-socials a { color: var(--cf-color-text-muted); transition: color 150ms; }
  .cf-footer-socials a:hover { color: var(--cf-color-primary-900); }
  .cf-footer-socials svg { width: 20px; height: 20px; display: block; }
</style>
</head>
<body>
